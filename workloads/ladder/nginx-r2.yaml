# R2: native K3s, two replicas on different nodes, PodDisruptionBudget minAvailable 1, default tolerations.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baseline-web
  namespace: failure-aware
  labels:
    failure-aware.io/ladder-arm: r2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: baseline-web
  template:
    metadata:
      labels:
        app: baseline-web
        failure-aware.io/ladder-arm: r2
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-worker1
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: baseline-web
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: baseline-web
  namespace: failure-aware
spec:
  selector:
    app: baseline-web
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30364
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: baseline-web
  namespace: failure-aware
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: baseline-web
