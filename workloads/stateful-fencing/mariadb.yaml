apiVersion: v1
kind: Namespace
metadata:
  name: failure-aware-db-test

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-fencing-pvc
  namespace: failure-aware-db-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-fencing-secret
  namespace: failure-aware-db-test
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: "fa-disposable-test-only"
  MARIADB_DATABASE: "fencing_test"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fenced-mariadb
  namespace: failure-aware-db-test
  labels:
    app: fenced-mariadb
    failure-aware.io/duplication-sensitive: "true"
    failure-aware.io/database-engine: "mariadb"

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: fenced-mariadb

  template:
    metadata:
      labels:
        app: fenced-mariadb
        failure-aware.io/duplication-sensitive: "true"
        failure-aware.io/database-engine: "mariadb"

    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker1

      securityContext:
        runAsUser: 999
        runAsGroup: 999

      containers:
        - name: mariadb
          image: mariadb:10.11.19
          imagePullPolicy: IfNotPresent

          envFrom:
            - secretRef:
                name: mariadb-fencing-secret

          ports:
            - name: mysql
              containerPort: 3306

          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  mariadb-admin ping
                  -h 127.0.0.1
                  -uroot
                  -p"$MARIADB_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb-fencing-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: fenced-mariadb
  namespace: failure-aware-db-test

spec:
  selector:
    app: fenced-mariadb

  ports:
    - name: mysql
      port: 3306
      targetPort: 3306