apiVersion: v1
kind: Namespace
metadata:
  name: failure-aware
---
apiVersion: v1
kind: Secret
metadata:
  name: remote-postgres
  namespace: failure-aware
type: Opaque
stringData:
  PGHOST: "<CRANE_DB_HOST>"
  PGPORT: "32761"
  PGDATABASE: "<DATABASE>"
  PGUSER: "<USER>"
  PGPASSWORD: "<PASSWORD>"
  PGSSLMODE: "require"
  DATABASE_URL: "postgresql://<USER>:<PASSWORD>@<CRANE_DB_HOST>:32761/<DATABASE>?sslmode=require"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-client
  namespace: failure-aware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-client
  template:
    metadata:
      labels:
        app: postgres-client
    spec:
      containers:
        - name: postgres-client
          image: postgres:16-alpine
          command: ["sh", "-c", "sleep infinity"]
          envFrom:
            - secretRef:
                name: remote-postgres