apiVersion: apps/v1
kind: Deployment
metadata:
  name: baseline-web
  namespace: failure-aware
spec:
  replicas: 1

  selector:
    matchLabels:
      app: baseline-web

  template:
    metadata:
      labels:
        app: baseline-web

    spec:
      nodeSelector:
        experiment-role: fault-target

      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"

        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"

      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: baseline-web
  namespace: failure-aware
spec:
  selector:
    app: baseline-web
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
