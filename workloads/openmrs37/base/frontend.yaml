apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmrs-frontend
  namespace: openmrs37
spec:
  replicas: 1

  selector:
    matchLabels:
      app: openmrs-frontend

  template:
    metadata:
      labels:
        app: openmrs-frontend

    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker1

      containers:
        - name: frontend

          image: openmrs/openmrs-reference-application-3-frontend:3.7.1
          imagePullPolicy: IfNotPresent

          env:
            - name: SPA_PATH
              value: /openmrs/spa

            - name: API_URL
              value: /openmrs

            - name: SPA_CONFIG_URLS
              value: /openmrs/spa/config-core_demo.json

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 96Mi

            limits:
              cpu: 300m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: openmrs-frontend
  namespace: openmrs37
spec:
  selector:
    app: openmrs-frontend

  ports:
    - name: http
      port: 80
      targetPort: 80