apiVersion: v1
kind: Pod
metadata:
  name: openmrs-mariadb-data-migration
  namespace: openmrs37
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: k3s-worker2
  containers:
    - name: migration
      image: alpine:3.20
      command:
        - sh
        - -c
        - sleep 36000
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      volumeMounts:
        - name: source
          mountPath: /source
          readOnly: true
        - name: destination
          mountPath: /destination
  volumes:
    - name: source
      persistentVolumeClaim:
        claimName: openmrs-mariadb-data
    - name: destination
      persistentVolumeClaim:
        claimName: openmrs-mariadb-data-nfs