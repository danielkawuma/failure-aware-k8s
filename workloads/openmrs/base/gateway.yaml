apiVersion: v1
kind: ConfigMap
metadata:
  name: openmrs-gateway-nginx
  namespace: openmrs
data:
  default.conf: |
    server {
      listen 80;
      listen [::]:80;

      absolute_redirect off;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location = / {
        return 301 /openmrs/spa/home;
      }

      location = /openmrs/spa {
        return 301 /openmrs/spa/home;
      }

      location = /openmrs/spa/ {
        return 301 /openmrs/spa/home;
      }

      location /openmrs/spa/ {
        rewrite ^/openmrs/spa/(.*)$ /$1 break;
        proxy_pass http://openmrs-frontend.openmrs.svc.cluster.local:80;
      }

      location /openmrs {
        proxy_read_timeout 300s;
        proxy_pass http://openmrs-backend.openmrs.svc.cluster.local:8080;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmrs-gateway
  namespace: openmrs
spec:
  replicas: 1

  selector:
    matchLabels:
      app: openmrs-gateway

  template:
    metadata:
      labels:
        app: openmrs-gateway

    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker1

      containers:
        - name: gateway
          image: openmrs/openmrs-reference-application-3-gateway:3.7.1
          imagePullPolicy: IfNotPresent

          command:
            - nginx
            - -g
            - daemon off;

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

      volumes:
        - name: nginx-config
          configMap:
            name: openmrs-gateway-nginx

---
apiVersion: v1
kind: Service
metadata:
  name: openmrs-gateway
  namespace: openmrs
spec:
  type: NodePort

  selector:
    app: openmrs-gateway

  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30365